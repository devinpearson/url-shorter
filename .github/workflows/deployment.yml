name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
  # Run by hand (Actions → CI/CD → Run workflow) to include the Lighthouse audit.
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch or PR supersedes an in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, type check, unit and API tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome (format, lint, imports)
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      - name: Unused files, exports and dependencies (knip)
        run: npm run knip

      - name: Markdown lint
        run: npm run lint:md

      - name: Unit and API tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build && npm run build:backend

  e2e:
    name: Playwright end-to-end tests
    # Pinned: Playwright can't install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse score floors
    # About 2 minutes of Chrome runs, so only when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the app and audits it against the e2e backend (floors in lighthouserc.json).
      - name: Run Lighthouse CI
        run: npm run verify:lighthouse

      # upload-artifact skips dot-directories unless told otherwise.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  # Build the image, smoke-test it, push it to GHCR, then start it on the Hetzner server.
  # The server side (stack folder, secrets.env, nginx and TLS for toast.li) is set up by
  # ansible/hetzner playbooks/configure-club-links.yml. See deploy/README.md.
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time; a newer push waits instead of racing the older one.
    concurrency:
      group: deploy-club-links
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      STACK_DIR: stacks/club-links
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/docker-smoke-test.sh "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

      - name: Create stack directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p "$HOME/${{ env.STACK_DIR }}"

      - name: Copy stack file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/compose.yml
          target: ${{ env.STACK_DIR }}
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_PORT: ${{ vars.APP_PORT || '8090' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,APP_PORT
          command_timeout: 10m
          script: |
            set -eu
            cd "$HOME/${{ env.STACK_DIR }}"

            # Ansible (ansible/hetzner playbooks/configure-club-links.yml) owns the secrets.
            if [ ! -f secrets.env ]; then
              echo "secrets.env is missing. Run playbooks/configure-club-links.yml first." >&2
              exit 1
            fi

            PREVIOUS_TAG=$(sed -n 's/^IMAGE_TAG=//p' .env 2>/dev/null || true)
            write_env() { printf 'IMAGE_TAG=%s\nAPP_PORT=%s\n' "$1" "$APP_PORT" > .env; }

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            write_env "$IMAGE_TAG"
            docker compose pull

            # --wait returns once db and app report healthy (migrations run as the app starts).
            if docker compose up -d --remove-orphans --wait --wait-timeout 180; then
              docker image prune -f >/dev/null
              echo "Deployed $IMAGE_TAG"
              exit 0
            fi

            echo "The new release did not become healthy." >&2
            docker compose logs --tail 80 app >&2 || true
            if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
              echo "Rolling back to $PREVIOUS_TAG" >&2
              write_env "$PREVIOUS_TAG"
              docker compose up -d --remove-orphans --wait --wait-timeout 180 || true
            fi
            exit 1
