# Example nginx site for https://toast.li
#
# One domain serves three things:
#   /api/...                          -> Express backend (pm2, port 5001)
#   app pages (/, /dashboard, ...)    -> the built React app (dist/index.html)
#   everything else (/club-roles)     -> Express, which redirects the short link
#
# Paths below assume the repo is deployed to /root/url-shorter (see .github/workflows/deployment.yml).
# Adjust them and the certificate paths to match the server, then:
#   sudo cp deploy/nginx/toast.li.conf /etc/nginx/sites-available/toast.li
#   sudo ln -s /etc/nginx/sites-available/toast.li /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream club_links_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name toast.li www.toast.li;
    return 301 https://toast.li$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.toast.li;
    ssl_certificate     /etc/letsencrypt/live/toast.li/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toast.li/privkey.pem;
    return 301 https://toast.li$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name toast.li;

    ssl_certificate     /etc/letsencrypt/live/toast.li/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toast.li/privkey.pem;

    root /root/url-shorter/dist;

    # Shared proxy settings. X-Forwarded-Proto lets Express mark the login cookie
    # as secure (app.set('trust proxy', 1) + NODE_ENV=production).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API and Auth0 login/callback/logout
    location /api/ {
        proxy_pass http://club_links_api;
    }

    # React app pages. Keep this list in sync with the routes in src/main.tsx
    # and RESERVED_SHORT_IDS in backend/src/routes/url.ts.
    # Case-insensitive (~*) like the app's routes; short links are lowercased by the backend,
    # so toast.li/Sunrise-Zoom and toast.li/sunrise-zoom are the same link.
    location ~* ^/(dashboard|login|about|contact|terms|stats/[^/]+)?/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Built assets have hashed names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files (favicon.svg, portrait.png), otherwise a short link.
    location / {
        try_files $uri @short_link;
    }

    location @short_link {
        proxy_pass http://club_links_api;
    }
}
