# Local development database. Start it with `npm run db:up`; the backend applies migrations
# when it starts (or run `npm run db:migrate`). Matches DATABASE_URL in backend/.env.example.
name: club-links-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: club_links
      POSTGRES_USER: club_links
      POSTGRES_PASSWORD: club_links_development_only
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club_links -d club_links"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
